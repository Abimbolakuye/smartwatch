<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Received — POEDAGAR Men's Watch</title>
<meta name="description" content="Your POEDAGAR Men's Watch order has been received. We'll be in touch shortly.">
<style>
  :root {
    --black: #000000;
    --purple: #925BF0;
    --purple-light: #d6bcfa;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Montserrat', 'Plus Jakarta Sans', Arial, sans-serif;
    background: var(--black);
    color: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    background: #111111;
    border-radius: 16px;
    padding: 40px 30px;
    text-align: center;
  }
  .check {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    background: var(--purple-light);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
  }
  .check svg { width: 34px; height: 34px; }
  h1 {
    color: var(--purple);
    font-size: 24px;
    font-weight: 700;
    margin: 0 0 16px;
    line-height: 1.3;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #e6e6e6;
    margin: 0 0 12px;
  }
  .price-note {
    margin-top: 20px;
    padding: 16px;
    background: #000000;
    border: 1px solid #925BF0;
    border-radius: 10px;
    font-size: 15px;
    color: #FFE100;
    font-weight: 700;
  }
  .btn {
    display: inline-block;
    margin-top: 28px;
    background: var(--purple-light);
    color: #000;
    font-weight: 700;
    padding: 14px 28px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 15px;
  }
</style>
</head>
<body>

<div class="card">
  <div class="check">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 13l4 4L19 7" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Thank you! Your order has been received.</h1>
  <p>A member of our team will call you shortly to confirm your delivery details.</p>
  <p>Please keep your phone reachable — failed deliveries lead to a great loss for us, so we only dispatch once your order is confirmed.</p>

  <div class="price-note">
    Amount due on delivery: ₦44,000
  </div>

  <a href="index.html" class="btn">Back to Home</a>
</div>

</body>
</html>
